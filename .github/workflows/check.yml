name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Check the candidate commit
        run: bash ci/check.sh
      - name: Save test and build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          if-no-files-found: warn

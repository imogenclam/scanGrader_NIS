name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Scan Git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --log-opts=--all --redact --no-banner
      - name: Check Go formatting
        run: |
          files=$(gofmt -l cmd internal web/*.go)
          if [[ -n "$files" ]]; then
            echo "$files"
            exit 1
          fi
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web code and build typed assets
        working-directory: web
        run: |
          mkdir -p ../test-results
          git rev-parse HEAD > ../test-results/commit-sha.txt
          npm test | tee ../test-results/frontend.txt
          npm run build
      - name: Analyze Go code
        run: go vet ./...
      - name: Provide a PDF renderer
        run: |
          if ! command -v gs >/dev/null && ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Exercise scan recognition and draft grading
        run: |
          go test -count=1 -v -run '^TestRenderedScanToDraft$' ./internal/ai | tee test-results/scan-to-draft.txt
          grep -Fq -- '--- PASS: TestRenderedScanToDraft' test-results/scan-to-draft.txt
      - name: Test Go code with coverage
        run: |
          go test -count=1 -json -coverpkg=./... -coverprofile=test-results/coverage.out ./... | tee test-results/go.jsonl
          go tool cover -func=test-results/coverage.out | tee test-results/coverage.txt
      - name: Build and exercise the HTTP service
        run: |
          go build -o "$RUNNER_TEMP/scangrader" ./cmd/server
          node tests/contract/classroom.mjs "$RUNNER_TEMP/scangrader" | tee test-results/http.txt
      - name: Check the classroom in Chrome
        run: |
          export CHROME_BIN
          CHROME_BIN=$(command -v google-chrome)
          npm --prefix web run test:browser -- "$RUNNER_TEMP/scangrader" | tee test-results/browser.txt
          npm --prefix web run test:polling | tee test-results/polling.txt
      - name: Check Compose and build the image
        run: |
          docker compose config --quiet
          docker build --tag "scangrader:$GITHUB_SHA" .
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore

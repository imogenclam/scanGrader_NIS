  <text x="78" y="513.92" fill="#19313D" text-anchor="start" font-size="20" font-family="Arial, sans-serif" font-weight="700" data-cell="d04-item-74">Ограничения и производные поля</text>
  <text x="78" y="551.363" fill="#17675F" text-anchor="start" font-size="15.5" font-family="Arial, sans-serif" font-weight="700" data-cell="d04-item-75">Роли и владелец · NFR-003</text>
  <text x="78" y="574.036" fill="#354D59" text-anchor="start" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d04-item-76">role принимает teacher или student. Если approved_by задан, он равен teacher_id.</text>
  <text x="78" y="609.363" fill="#17675F" text-anchor="start" font-size="15.5" font-family="Arial, sans-serif" font-weight="700" data-cell="d04-item-77">Момент публикации</text>
  <text x="78" y="632.036" fill="#354D59" text-anchor="start" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d04-item-78">approved_by и approved_at заполняются вместе. По approved_at код определяет статус.</text>
  <text x="78" y="667.363" fill="#17675F" text-anchor="start" font-size="15.5" font-family="Arial, sans-serif" font-weight="700" data-cell="d04-item-79">Границы балла · NFR-006</text>
  <text x="78" y="690.036" fill="#354D59" text-anchor="start" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d04-item-80">SQL требует 0 ≤ draft_score ≤ max_score и score ≥ 0. Код также проверяет верхнюю границу итога.</text>
  <text x="78" y="725.363" fill="#17675F" text-anchor="start" font-size="15.5" font-family="Arial, sans-serif" font-weight="700" data-cell="d04-item-81">Сохранность результата · NFR-007</text>
  <text x="78" y="748.036" fill="#354D59" text-anchor="start" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d04-item-82">В каждой таблице строк пара (submission_id, number) уникальна. При чтении сервис считает сумму.</text>

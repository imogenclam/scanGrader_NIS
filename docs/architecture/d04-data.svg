  <text x="916.5" y="145.6" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">1 : N · автор / утвердивший</text>
  <text x="36" y="748.44" fill="#1D3349" font-family="Arial, sans-serif" font-size="16" text-anchor="start">tasks, draft и final содержат JSON. Файлы PDF и .tex находятся вне БД. Их имена хранятся в строках заданий и сдач.</text>
  <text x="36" y="780.44" fill="#1D3349" font-family="Arial, sans-serif" font-size="16" text-anchor="start">Ключи подтверждения и сброса разделены префиксом. Для адресов действующих аккаунтов применяется уникальный индекс.</text>
  <text x="36" y="833.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="start">PK — первичный ключ, FK — внешний ключ, UQ — ограничение уникальности. Стрелка 1 : N идёт от родителя к зависимым строкам.</text>

  <title id="title">D-01. Контекст системы</title>
  <desc id="desc">Архитектура Scan Grader. ADR-001, ADR-003 · NFR-002, NFR-003, NFR-008. Редакция КТ-2 от 22 ноября 2026 года.</desc>

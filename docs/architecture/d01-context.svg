  <rect x="770" y="278" width="134" height="21" fill="white" />
  <text x="837.0" y="293.6" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">HTTPS · страницы</text>
  <polyline points="743,345 821,345 821,448 920,448" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="790" y="453" width="130" height="21" fill="white" />
  <text x="855.0" y="468.6" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">HTTPS · JSON</text>
  <text x="36" y="530.28" fill="#1D3349" font-family="Arial, sans-serif" font-size="17" text-anchor="start">Без SMTP письмо записывается локально. При недоступности ИИ преподаватель оценивает исходный PDF.</text>
  <text x="36" y="573.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="start">Серые блоки обозначают пользователей, зелёный — сервис, охристые — внешние системы. Стрелки указывают инициатора обмена.</text>
</svg>
  <text x="1042.0" y="175.78" fill="#4A6276" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Код подтверждения</text>
  <text x="1042.0" y="198.78" fill="#4A6276" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">или сброса пароля</text>

  <title id="title">D-05. Сдача работы и утверждение черновика</title>
  <desc id="desc">Архитектура Scan Grader. ADR-001, ADR-002, ADR-003 · NFR-001, NFR-003, NFR-006, NFR-012. Редакция КТ-2 от 22 ноября 2026 года.</desc>

  <text x="598.0" y="158.26" fill="#4A6276" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">закрытый том</text>
  <polyline points="598,172 598,707" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" />

  <text x="36" y="88.56" fill="#1D3349" font-family="Arial, sans-serif" font-size="34" text-anchor="start" font-weight="700">Сдача работы и утверждение черновика</text>
  <text x="36" y="807.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="start">ADR-001, ADR-002, ADR-003 · NFR-001, NFR-003, NFR-006, NFR-012</text>
  <text x="36" y="832.6" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="start">КТ-2 · редакция 1 · 22.11.2026</text>

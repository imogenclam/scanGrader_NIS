  <rect x="356" y="229" width="239" height="22" fill="white" />
  <text x="475.5" y="245.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">2. PDF и запись queued</text>
  <polyline points="353,298 113,298" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="116" y="273" width="234" height="22" fill="white" />
  <text x="233.0" y="289.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">3. HTTP 201 и ID сдачи</text>
  <polyline points="843,342 598,342" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="601" y="317" width="239" height="22" fill="white" />
  <text x="720.5" y="333.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">4. Захватить queued</text>
  <polyline points="598,386 843,386" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="601" y="361" width="239" height="22" fill="white" />
  <text x="720.5" y="377.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">5. PDF, версия и эталон</text>
  <polyline points="843,430 598,430" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="601" y="405" width="239" height="22" fill="white" />
  <text x="720.5" y="421.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">6. Проверить и записать draft</text>
  <polyline points="1083,474 353,474" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="356" y="449" width="724" height="22" fill="white" />
  <text x="718.0" y="465.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">7. Открыть PDF и черновик</text>
  <polyline points="353,518 1083,518" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="356" y="493" width="724" height="22" fill="white" />
  <text x="718.0" y="509.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">8. Оригинал и строки задач</text>
  <polyline points="1083,562 353,562" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="356" y="537" width="724" height="22" fill="white" />
  <text x="718.0" y="553.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">9. Исправить и утвердить оценку</text>
  <polyline points="353,606 598,606" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="356" y="581" width="239" height="22" fill="white" />
  <text x="475.5" y="597.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">10. final и approved</text>
  <polyline points="113,650 353,650" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="116" y="625" width="234" height="22" fill="white" />
  <text x="233.0" y="641.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">11. Запросить результат</text>
  <polyline points="353,694 113,694" fill="none" stroke="#4A6276" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="116" y="669" width="234" height="22" fill="white" />
  <text x="233.0" y="685.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">12. Утверждённые баллы</text>
  <text x="36" y="743.44" fill="#1D3349" font-family="Arial, sans-serif" font-size="16" text-anchor="start">На шаге 6 обработчик вызывает OCR и модель по HTTPS. Черновик и итог хранятся раздельно.</text>
  <text x="36" y="776.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="start">Время идёт сверху вниз. Сплошная стрелка обозначает вызов или запись, пунктирная горизонтальная стрелка — ответ.</text>
</svg>
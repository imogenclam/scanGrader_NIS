  <text x="427.5" y="325.382" fill="#4C6471" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-32">127.0.0.1:${SG_PORT:-8080}</text>
  <text x="428.5" y="367.036" fill="#4C6471" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-33">TCP → 8080 в контейнере</text>
  <polyline points="1021,361 1175,361" stroke="#496778" fill="none" stroke-width="2" stroke-linejoin="round" data-cell="d03-item-34" marker-end="url(#arrow-regular)" />
  <text x="1111" y="350.036" fill="#4C6471" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-35">app-data:/data</text>
  <text x="1104" y="384.344" fill="#4C6471" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-36">чтение / запись</text>
  <rect x="40" y="621" width="660" height="118" rx="7" fill="#F3F7F7" stroke="#C9D8D8" stroke-width="1.2" data-cell="d03-credentials" />
  <text x="56" y="645.19" fill="#17675F" text-anchor="start" font-size="15" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-38">Доступ к демоданным</text>
  <text x="56" y="673.209" fill="#354D59" text-anchor="start" font-size="16.5" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-39">Первый запуск создаёт токены двух ролей в SQLite. Команда</text>
  <text x="56" y="695.209" fill="#354D59" text-anchor="start" font-size="16.5" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-40">scangrader token teacher или scangrader token student выдаёт токен.</text>
  <rect x="722" y="621" width="678" height="118" rx="7" fill="#FFFAED" stroke="#B18C42" stroke-width="1.2" data-cell="d03-vm" stroke-dasharray="7 5" />
  <text x="738" y="645.19" fill="#886420" text-anchor="start" font-size="15" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-42">Учебная ВМ · проектный профиль S1</text>
  <text x="738" y="673.209" fill="#354D59" text-anchor="start" font-size="16.5" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-43">Одна ВМ с 2 vCPU и 4 ГБ RAM. Запуск и обновление · NFR-005.</text>
  <text x="738" y="695.209" fill="#354D59" text-anchor="start" font-size="16.5" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-44">Цель NFR-007 включает резервную копию вне ВМ и восстановление.</text>

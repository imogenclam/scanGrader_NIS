  <text x="36" y="614.94" fill="#1D3349" font-family="Arial, sans-serif" font-size="16" text-anchor="start">¹ Compose публикует 127.0.0.1:8080 → app:8080. GET /healthz проверяет доступ к БД. Прокси настраивает владелец ВМ.</text>
  <text x="36" y="645.44" fill="#1D3349" font-family="Arial, sans-serif" font-size="16" text-anchor="start">² Доставка образа и восстановление по резервной копии запланированы. Проверки КТ-2 запускаются отдельно от ВМ.</text>
  <text x="36" y="668.1" fill="#4A6276" font-family="Arial, sans-serif" font-size="15" text-anchor="start">Сплошная стрелка обозначает рабочее соединение, пунктирная — запланированную операцию на ВМ.</text>

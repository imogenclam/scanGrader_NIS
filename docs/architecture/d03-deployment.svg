  <text x="589" y="250.344" fill="#17675F" text-anchor="start" font-size="14" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-15">СЕТЬ COMPOSE  /  СЕРВИС APP</text>
  <rect x="596" y="276" width="425" height="169" rx="8" fill="#E9F4EF" stroke="#4D8A7E" stroke-width="1.5" data-cell="d03-app" />
  <text x="611" y="299.325" fill="#17675F" text-anchor="start" font-size="12.5" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-17">КОНТЕЙНЕР</text>
  <text x="611" y="330.458" fill="#19313D" text-anchor="start" font-size="23" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-18">Бинарник scangrader</text>
  <text x="611" y="364.382" fill="#354D59" text-anchor="start" font-size="17" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-19">Сборка Go 1.26.11, образ Alpine 3.23.</text>
  <text x="611" y="387.382" fill="#354D59" text-anchor="start" font-size="17" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-20">USER 10001:10001 · отдельный пользователь.</text>
  <text x="611" y="410.382" fill="#354D59" text-anchor="start" font-size="17" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-21">SG_ADDR=:8080  ·  SG_DATA_DIR=/data</text>
  <text x="596" y="481.536" fill="#17675F" text-anchor="start" font-size="16" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-22">HEALTHCHECK · каждые 3 с</text>
  <text x="596" y="506.536" fill="#354D59" text-anchor="start" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-23">GET /healthz проверяет БД через PingContext.</text>
  <text x="596" y="530.536" fill="#354D59" text-anchor="start" font-size="16" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-24">200 при успехе, 503 при ошибке БД.</text>
  <rect x="1175" y="276" width="201" height="169" rx="8" fill="#EEF0F8" stroke="#7C83A1" stroke-width="1.5" data-cell="d03-volume" />
  <text x="1190" y="299.325" fill="#4C6471" text-anchor="start" font-size="12.5" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-26">ИМЕНОВАННЫЙ ТОМ</text>
  <text x="1190" y="330.458" fill="#19313D" text-anchor="start" font-size="23" font-family="Consolas, monospace" font-weight="700" data-cell="d03-item-27">app-data</text>
  <text x="1190" y="364.382" fill="#354D59" text-anchor="start" font-size="17" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-28">Каталог /data.</text>
  <text x="1190" y="387.382" fill="#354D59" text-anchor="start" font-size="17" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-29">Файл scangrader.db.</text>
  <text x="1190" y="410.382" fill="#354D59" text-anchor="start" font-size="17" font-family="Arial, sans-serif" font-weight="400" data-cell="d03-item-30">SQLite WAL.</text>

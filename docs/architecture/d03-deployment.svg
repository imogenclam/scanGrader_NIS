  <text x="57" y="200.344" fill="#17675F" text-anchor="start" font-size="14" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-9">ЛОКАЛЬНЫЙ ХОСТ  /  DOCKER COMPOSE</text>
  <rect x="62" y="266" width="220" height="129" rx="8" fill="#F2F6F8" stroke="#7B95A3" stroke-width="1.5" data-cell="d03-client" />
  <text x="77" y="289.325" fill="#4C6471" text-anchor="start" font-size="12.5" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-11">КЛИЕНТ НА ХОСТЕ</text>
  <text x="77" y="319.766" fill="#19313D" text-anchor="start" font-size="21" font-family="Arial, sans-serif" font-weight="700" data-cell="d03-item-12">curl / API-клиент</text>

<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title description" data-page="D-03">
  <title id="title">D-03. Размещение приложения</title>
  <desc id="description">Compose запускает сервис app. По умолчанию клиент обращается к порту 8080 на том же хосте. Scan Grader. КТ-2. Версия 1 от 24.11.2026.</desc>

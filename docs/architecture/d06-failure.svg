  <text x="36" y="655.44" fill="#1D3349" font-family="Arial, sans-serif" font-size="16" text-anchor="start">При настроенной модели преподаватель также может вернуть ручную работу в очередь один раз. Доступ студента к итогу открывает утверждение.</text>
